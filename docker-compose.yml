services:
  db:
    image: postgres:16-alpine
    container_name: orbis_postgres_db
    restart: always
    environment:
      POSTGRES_USER: orbis_user
      POSTGRES_PASSWORD: orbis_password
      POSTGRES_DB: orbis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis_user -d orbis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbis_backend
    restart: always
    environment:
      PROJECT_NAME: "Orbis Video Studio AI"
      ENVIRONMENT: "development"
      DEBUG: "True"
      API_V1_STR: "/api/v1"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: orbis_user
      POSTGRES_PASSWORD: orbis_password
      POSTGRES_DB: orbis_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
