services:
  db:
    image: postgres:16-alpine
    container_name: orbis_postgres_db
    restart: always
    environment:
      POSTGRES_USER: orbis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orbis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis_user -d orbis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: orbis_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minio_user}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change_me_in_env_file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbis_backend
    restart: always
    environment:
      PROJECT_NAME: "Orbis Video Studio AI"
      ENVIRONMENT: "development"
      DEBUG: "True"
      API_V1_STR: "/api/v1"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: orbis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orbis_db
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_BUCKET: "orbis-assets"
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-minio_user}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-change_me_in_env_file}"
      OBJECT_STORAGE_SECURE: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  minio_data:
