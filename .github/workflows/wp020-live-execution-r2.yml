name: WP020 LIVE R2 Paid One-Shot Execution

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wp020-live-r2-paid-one-shot
  cancel-in-progress: false

jobs:
  live_execution:
    name: Execute Bounded LIVE UAT R2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbis_uat
          POSTGRES_PASSWORD: orbis_uat_password
          POSTGRES_DB: orbis_live_uat_r2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis_uat -d orbis_live_uat_r2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WP020_LIVE_EXECUTION_ID: LIVE-20260909-BB75-R2
      PREFLIGHT_BASE_SHA: bb75c8087428cb14a57a3557b9013f5472f976bf
      PREFLIGHT_MAIN_SHA: ${{ github.sha }}
      WP020_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/live_evidence
      ISSUE_NUMBER: "63"
      ENVIRONMENT: uat
      DEBUG: "false"
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: orbis_uat
      POSTGRES_PASSWORD: orbis_uat_password
      POSTGRES_DB: orbis_live_uat_r2
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: orbis-live-uat-r2
      OBJECT_STORAGE_ACCESS_KEY: orbisminio
      OBJECT_STORAGE_SECRET_KEY: orbisminiosecret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_SECURE: "false"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CREATIVE_MODEL: gpt-4o
      OPENAI_MAX_RETRIES: "0"
      DEFAULT_CREATIVE_PROFILE: FAST

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_SIZE: 1K

      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}

      DEFAULT_IMAGE_PROVIDER: gemini_image
      DEFAULT_VIDEO_PROVIDER: vidu
      DEFAULT_AUDIO_PROVIDER: elevenlabs_audio

      PROVIDER_PRICING_CONFIG: >-
        {"openai:STORY_GENERATION:gpt-4o":{"provider":"openai","operation":"STORY_GENERATION","model":"gpt-4o","cost_per_1k_prompt_tokens":0.0025,"cost_per_1k_completion_tokens":0.0100,"currency":"USD"},"gemini_image:IMAGE_GENERATION:gemini-3.1-flash-image":{"provider":"gemini_image","operation":"IMAGE_GENERATION","model":"gemini-3.1-flash-image","cost_per_generation":0.08,"currency":"USD"},"vidu:VIDEO_GENERATION:viduq2":{"provider":"vidu","operation":"VIDEO_GENERATION","model":"viduq2","cost_per_generation":0.05,"cost_per_second":0.025,"currency":"USD"}}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard manual canonical-main execution
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "STOP: R2 LIVE may run only by workflow_dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "STOP: R2 LIVE must be dispatched on canonical main; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PREFLIGHT_BASE_SHA" HEAD
          echo "Manual canonical-main guard PASS at $GITHUB_SHA"

      - name: Require fresh Owner R2 paid authorization and unused fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_MARKER="FRESH_OWNER_AUTHORIZED_R2: $WP020_LIVE_EXECUTION_ID @ $GITHUB_SHA"
          COMMENTS="$(gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '.comments[].body')"
          if ! printf '%s\n' "$COMMENTS" | grep -Fx "$AUTH_MARKER" >/dev/null; then
            echo "STOP: exact fresh Owner R2 paid authorization marker missing for current main" >&2
            exit 1
          fi
          if printf '%s\n' "$COMMENTS" | grep -Fx "EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID" >/dev/null; then
            echo "STOP: R2 one-shot execution fence already consumed" >&2
            exit 1
          fi
          echo "Fresh Owner authorization present; R2 fence remains unused"

      - name: Start ephemeral MinIO
        shell: bash
        run: |
          docker run -d --rm --name orbis-live-r2-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "Ephemeral object storage ready"
              exit 0
            fi
            sleep 1
          done
          echo "STOP: ephemeral object storage failed health check" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg and ffprobe are available
        shell: bash
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Rerun R2 no-paid preflight before fence
        working-directory: backend
        run: PYTHONPATH=. python ../.github/scripts/wp020_live_r2_preflight.py

      - name: Recheck authorization and atomically consume Issue 63 R2 fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_MARKER="FRESH_OWNER_AUTHORIZED_R2: $WP020_LIVE_EXECUTION_ID @ $GITHUB_SHA"
          COMMENTS="$(gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '.comments[].body')"
          if ! printf '%s\n' "$COMMENTS" | grep -Fx "$AUTH_MARKER" >/dev/null; then
            echo "STOP: Owner authorization marker disappeared or no longer matches exact main" >&2
            exit 1
          fi
          if printf '%s\n' "$COMMENTS" | grep -Fx "EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID" >/dev/null; then
            echo "STOP: R2 one-shot fence already consumed" >&2
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --body "EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID"
          echo "R2 one-shot execution fence consumed"

      - name: Run bounded LIVE R2 UAT runner
        working-directory: backend
        env:
          AUTHORIZED_MAIN_SHA: ${{ github.sha }}
          EXECUTION_FENCE_CONFIRMED: "true"
        run: PYTHONPATH=. python ../.github/scripts/wp020_live_uat_r2.py

      - name: Post Issue 63 sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md"
          else
            echo "No runner issue-comment.md evidence found"
          fi

      - name: Upload sanitized LIVE R2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp020-live-evidence-${{ env.WP020_LIVE_EXECUTION_ID }}
          path: ${{ env.WP020_LIVE_EVIDENCE_DIR }}
          if-no-files-found: warn
