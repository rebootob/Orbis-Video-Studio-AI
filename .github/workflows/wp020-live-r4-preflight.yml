name: WP020 LIVE R4 No-Paid Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp020-live-r4-no-paid-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate R4 Runtime Without Provider Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbis_uat
          POSTGRES_PASSWORD: orbis_uat_password
          POSTGRES_DB: orbis_live_uat_r4_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis_uat -d orbis_live_uat_r4_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WP020_LIVE_EXECUTION_ID: LIVE-20260909-DE17-R4
      TOOLING_BASE_SHA: de17a125dcd3b8066a546369d03aba813a7b5641
      PREFLIGHT_MAIN_SHA: ${{ github.sha }}
      ENVIRONMENT: uat
      DEBUG: "false"
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: orbis_uat
      POSTGRES_PASSWORD: orbis_uat_password
      POSTGRES_DB: orbis_live_uat_r4_preflight
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: orbis-live-uat-r4-preflight
      OBJECT_STORAGE_ACCESS_KEY: orbisminio
      OBJECT_STORAGE_SECRET_KEY: orbisminiosecret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_SECURE: "false"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CREATIVE_MODEL: gpt-4o
      OPENAI_MAX_RETRIES: "0"
      DEFAULT_CREATIVE_PROFILE: FAST

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_SIZE: 1K

      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}

      DEFAULT_IMAGE_PROVIDER: gemini_image
      DEFAULT_VIDEO_PROVIDER: vidu
      DEFAULT_AUDIO_PROVIDER: elevenlabs_audio

      PROVIDER_PRICING_CONFIG: >-
        {"openai:STORY_GENERATION:gpt-4o":{"provider":"openai","operation":"STORY_GENERATION","model":"gpt-4o","cost_per_1k_prompt_tokens":0.0025,"cost_per_1k_completion_tokens":0.0100,"currency":"USD"},"gemini_image:IMAGE_GENERATION:gemini-3.1-flash-image":{"provider":"gemini_image","operation":"IMAGE_GENERATION","model":"gemini-3.1-flash-image","cost_per_generation":0.08,"currency":"USD"},"vidu:VIDEO_GENERATION:viduq2":{"provider":"vidu","operation":"VIDEO_GENERATION","model":"viduq2","cost_per_generation":0.05,"cost_per_second":0.025,"currency":"USD"}}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard manual canonical-main preflight
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "STOP: R4 preflight may run only by workflow_dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "STOP: R4 preflight must be dispatched on canonical main; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TOOLING_BASE_SHA" HEAD
          echo "Manual canonical-main R4 no-paid preflight guard PASS at $GITHUB_SHA"

      - name: Start ephemeral MinIO
        shell: bash
        run: |
          docker run -d --rm --name orbis-live-r4-preflight-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "Ephemeral object storage ready"
              exit 0
            fi
            sleep 1
          done
          echo "STOP: ephemeral object storage failed health check" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run R4 no-paid preflight
        working-directory: backend
        run: PYTHONPATH=.:../.github/scripts python ../.github/scripts/wp020_live_r4_preflight.py

      - name: Assert no generation or fence side effects
        shell: bash
        run: |
          echo "R4 no-paid preflight completed. generation_request_sent=false paid_provider_calls=0 execution_fence_written=false"
