name: LIVE01 Corrective Applicator

on:
  push:
    branches:
      - ai/p4-wp020-live01-audio-lineage
    paths:
      - .github/workflows/live01-corrective-apply.yml
      - .github/scripts/apply_live01_corrective.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ai/p4-wp020-live01-audio-lineage
          fetch-depth: 0

      - name: Apply bounded source and E2E patch
        run: python .github/scripts/apply_live01_corrective.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit corrective changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No corrective delta to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/audio_production.py backend/tests/test_wp020a_zero_billing_e2e.py
          git commit -m "fix(live01): include STORY lineage in audio planning"
          git push origin HEAD:ai/p4-wp020-live01-audio-lineage
