name: WP020 LIVE R5 Vidu2 1-Call Probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'dry-run' (default, zero POST) or 'live' (single-call probe)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  issues: write

concurrency:
  group: wp020-live-r5-vidu2-probe
  cancel-in-progress: false

jobs:
  vidu2_probe:
    name: Execute Bounded 1-Call Vidu2 Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WP020_VIDU2_EXECUTION_ID: LIVE-20260910-VIDU2-R5
      CANONICAL_BASE_SHA: cdfe3ce44ba9a9d6219909d12c0536c1cd716cec
      ISSUE_NUMBER: "63"
      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard manual canonical-main probe dispatch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "STOP: VIDU2 probe may run only by workflow_dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "STOP: VIDU2 probe must be dispatched on canonical main; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CANONICAL_BASE_SHA" HEAD
          echo "Canonical-main ancestry guard PASS at $GITHUB_SHA"

      - name: Check Owner authorization & fence if live
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "live" ]; then
            echo "Checking Owner authorization marker and execution fence for $WP020_VIDU2_EXECUTION_ID..."
            AUTH_MARKER="FRESH_OWNER_AUTHORIZED_VIDU2: ${WP020_VIDU2_EXECUTION_ID} @ ${GITHUB_SHA}"
            FENCE_MARKER="EXECUTION_STARTED: ${WP020_VIDU2_EXECUTION_ID}"
            TERMINAL_PASS="VIDU2_PROBE_PASS: ${WP020_VIDU2_EXECUTION_ID}"
            TERMINAL_STOP="VIDU2_PROBE_STOPPED: ${WP020_VIDU2_EXECUTION_ID}"

            COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq '.[].body')"
            if [ -z "${COMMENTS}" ]; then
              echo "STOP: failed to retrieve Issue #${ISSUE_NUMBER} comments or comment list is empty" >&2
              exit 1
            fi

            if ! printf '%s\n' "${COMMENTS}" | grep -Fx "${AUTH_MARKER}" >/dev/null; then
              echo "STOP: exact fresh Owner VIDU2 paid authorization marker missing for current main" >&2
              exit 1
            fi
            if printf '%s\n' "${COMMENTS}" | grep -Fx "${FENCE_MARKER}" >/dev/null; then
              echo "STOP: VIDU2 one-shot execution fence already consumed" >&2
              exit 1
            fi
            if printf '%s\n' "${COMMENTS}" | grep -F "${TERMINAL_PASS}" >/dev/null || printf '%s\n' "${COMMENTS}" | grep -F "${TERMINAL_STOP}" >/dev/null; then
              echo "STOP: VIDU2 execution identity already has terminal evidence" >&2
              exit 1
            fi

            if [ -z "${VIDU_API_KEY:-}" ]; then
              echo "STOP: VIDU_API_KEY is missing; execution fence NOT consumed" >&2
              exit 1
            fi

            echo "Consuming VIDU2 execution fence..."
            gh issue comment "${ISSUE_NUMBER}" --body "${FENCE_MARKER}"
            echo "VIDU2 execution fence consumed successfully."

            # Export verified live execution permit to runner environment
            echo "VIDU2_OWNER_AUTHORIZATION_CONFIRMED=true" >> "$GITHUB_ENV"
            echo "EXECUTION_FENCE_CONFIRMED=true" >> "$GITHUB_ENV"
            echo "AUTHORIZED_MAIN_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "CURRENT_EXECUTION_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "Dry-run / preflight mode: zero provider generation calls, no fence consumed."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run VIDU2 probe
        run: |
          mkdir -p vidu2_evidence
          PYTHONPATH=backend:. python .github/scripts/wp020_live_r5_vidu2.py --mode ${{ github.event.inputs.mode }}

      - name: Post terminal marker and evidence to Issue 63 if live
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "live" ] && [ -f vidu2_evidence/vidu2_execution_evidence.json ]; then
            STATUS="$(jq -r .status vidu2_evidence/vidu2_execution_evidence.json)"
            if [ "$STATUS" = "SUCCESS" ]; then
              MARKER="VIDU2_PROBE_PASS: ${WP020_VIDU2_EXECUTION_ID}"
            else
              MARKER="VIDU2_PROBE_STOPPED: ${WP020_VIDU2_EXECUTION_ID}"
            fi
            BODY=$(cat <<EOF
          ${MARKER}

          Sanitized VIDU2 Execution Evidence:
          \`\`\`json
          $(cat vidu2_evidence/vidu2_execution_evidence.json)
          \`\`\`
          EOF
          )
            gh issue comment "${ISSUE_NUMBER}" --body "${BODY}"
          fi

      - name: Upload sanitized VIDU2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidu2-probe-sanitized-evidence
          path: vidu2_evidence/vidu2_execution_evidence.json
          if-no-files-found: ignore
