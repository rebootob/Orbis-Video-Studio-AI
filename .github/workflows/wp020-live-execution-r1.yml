name: WP020 LIVE One-Shot Execution R1

on:
  push:
    branches:
      - ai/p4-wp020-live-execution-r1
    paths:
      - .github/workflows/wp020-live-execution-r1.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live_execution:
    name: Execute Bounded LIVE UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbis_uat
          POSTGRES_PASSWORD: orbis_uat_password
          POSTGRES_DB: orbis_live_uat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis_uat -d orbis_live_uat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WP020_LIVE_EXECUTION_ID: LIVE-20260908-B023-R1
      AUTHORIZED_MAIN_SHA: b0233729e1882267123c863d98df861c50a66a3b
      WP020_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/live_evidence
      ISSUE_NUMBER: "63"
      ENVIRONMENT: uat
      DEBUG: "false"
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: orbis_uat
      POSTGRES_PASSWORD: orbis_uat_password
      POSTGRES_DB: orbis_live_uat
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: orbis-live-uat
      OBJECT_STORAGE_ACCESS_KEY: orbisminio
      OBJECT_STORAGE_SECRET_KEY: orbisminiosecret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_SECURE: "false"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CREATIVE_MODEL: gpt-4o
      OPENAI_MAX_RETRIES: "0"
      DEFAULT_CREATIVE_PROFILE: FAST

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_SIZE: 1K

      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}

      DEFAULT_IMAGE_PROVIDER: gemini_image
      DEFAULT_VIDEO_PROVIDER: vidu
      DEFAULT_AUDIO_PROVIDER: elevenlabs_audio

      PROVIDER_PRICING_CONFIG: >-
        {"openai:STORY_GENERATION:gpt-4o":{"provider":"openai","operation":"STORY_GENERATION","model":"gpt-4o","cost_per_1k_prompt_tokens":0.0025,"cost_per_1k_completion_tokens":0.0100,"currency":"USD"},"gemini_image:IMAGE_GENERATION:gemini-3.1-flash-image":{"provider":"gemini_image","operation":"IMAGE_GENERATION","model":"gemini-3.1-flash-image","cost_per_generation":0.08,"currency":"USD"},"vidu:VIDEO_GENERATION:viduq2":{"provider":"vidu","operation":"VIDEO_GENERATION","model":"viduq2","cost_per_generation":0.05,"cost_per_second":0.025,"currency":"USD"}}

    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard authorized base ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor "$AUTHORIZED_MAIN_SHA" HEAD
          echo "Authorized main base $AUTHORIZED_MAIN_SHA is an ancestor of HEAD"

      - name: Start ephemeral MinIO
        shell: bash
        run: |
          docker run -d --rm --name orbis-live-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "Ephemeral object storage ready"
              exit 0
            fi
            sleep 1
          done
          echo "Ephemeral object storage failed health check" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg and ffprobe are available
        shell: bash
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Rerun no-paid guards
        working-directory: backend
        run: |
          python - << 'EOF'
          import os
          import sys
          from app.core.config import settings
          from app.providers.audio.elevenlabs_adapter import ElevenLabsAudioProviderAdapter
          from app.providers.image.gemini_adapter import GeminiImageProviderAdapter
          from app.providers.vidu import ViduProviderAdapter
          from app.services.creative_generation.openai_provider import OpenAICreativeGenerationProvider
          from app.services.pricing import CostStatus, ProviderPricingService
          from app.services.storage.factory import get_storage_provider

          REQUIRED_SECRET_NAMES = (
              "OPENAI_API_KEY",
              "GEMINI_API_KEY",
              "VIDU_API_KEY",
              "ELEVENLABS_API_KEY",
              "ELEVENLABS_DEFAULT_VOICE_ID",
          )
          missing = [name for name in REQUIRED_SECRET_NAMES if not os.environ.get(name, "").strip()]
          if missing:
              sys.exit(f"PREFLIGHT_FAIL: missing required credentials: {', '.join(missing)}")

          assert settings.OPENAI_CREATIVE_MODEL == "gpt-4o", "OPENAI model drift"
          assert settings.OPENAI_MAX_RETRIES == 0, "OPENAI_MAX_RETRIES must be 0"
          assert settings.GEMINI_IMAGE_MODEL == "gemini-3.1-flash-image", "Gemini model drift"
          assert settings.GEMINI_IMAGE_SIZE == "1K", "Gemini image size must be 1K"
          assert settings.VIDU_DEFAULT_MODEL == "viduq2", "Vidu model drift"
          assert settings.DEFAULT_IMAGE_PROVIDER == "gemini_image", "image routing drift"
          assert settings.DEFAULT_VIDEO_PROVIDER == "vidu", "video routing drift"
          assert settings.DEFAULT_AUDIO_PROVIDER == "elevenlabs_audio", "audio routing drift"

          openai = OpenAICreativeGenerationProvider()
          gemini = GeminiImageProviderAdapter()
          vidu = ViduProviderAdapter()
          eleven = ElevenLabsAudioProviderAdapter()
          assert bool(getattr(openai, "api_key", "").strip()), "OpenAI adapter credential missing"
          assert gemini.validate_config({}), "Gemini adapter config invalid"
          assert vidu.validate_config({}), "Vidu adapter config invalid"
          assert eleven.validate_config({}), "ElevenLabs adapter config invalid"

          ProviderPricingService.reset()
          c, curr, s = ProviderPricingService.estimate_cost(
              "openai", "STORY_GENERATION", "gpt-4o",
              {"prompt_tokens": 500, "completion_tokens": 1000},
          )
          assert s != CostStatus.UNKNOWN and curr == "USD" and c is not None and c > 0, "OpenAI pricing UNKNOWN"

          c, curr, s = ProviderPricingService.estimate_cost(
              "gemini_image", "IMAGE_GENERATION", "gemini-3.1-flash-image", {}
          )
          assert s != CostStatus.UNKNOWN and curr == "USD" and c is not None and 0 < c <= 0.08, "Gemini pricing UNKNOWN"

          c, curr, s = ProviderPricingService.estimate_cost(
              "vidu", "VIDEO_GENERATION", "viduq2", {"duration_seconds": 4.0}
          )
          assert s != CostStatus.UNKNOWN and curr == "USD" and c is not None and 0 < c <= 0.15, "Vidu pricing UNKNOWN"

          storage = get_storage_provider()
          storage.ensure_bucket_exists(settings.OBJECT_STORAGE_BUCKET)
          print("NO_PAID_GUARDS_PASS: All runtime guards verified successfully.")
          EOF

      - name: Guard execution fence and write Issue #63 marker
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking Issue #$ISSUE_NUMBER for existing execution marker..."
          EXISTING=$(gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '.comments[].body' | grep -E "^EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID" || true)
          if [ -n "$EXISTING" ]; then
            echo "STOP: One-shot fence already consumed! Marker found in Issue #$ISSUE_NUMBER" >&2
            exit 1
          fi

          echo "Atomically writing EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID to Issue #$ISSUE_NUMBER..."
          gh issue comment "$ISSUE_NUMBER" --body "EXECUTION_STARTED: $WP020_LIVE_EXECUTION_ID"

      - name: Run bounded LIVE UAT runner
        working-directory: backend
        env:
          EXECUTION_FENCE_CONFIRMED: "true"
        run: |
          PYTHONPATH=. python ../.github/scripts/wp020_live_uat.py

      - name: Post Issue #63 evidence comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md" ]; then
            echo "Posting issue-comment.md to Issue #$ISSUE_NUMBER..."
            gh issue comment "$ISSUE_NUMBER" --body-file "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md"
          else
            echo "No issue-comment.md found to post."
          fi

      - name: Upload sanitized live evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp020-live-evidence-${{ env.WP020_LIVE_EXECUTION_ID }}
          path: ${{ env.WP020_LIVE_EVIDENCE_DIR }}
          if-no-files-found: warn
