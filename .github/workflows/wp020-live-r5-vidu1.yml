name: WP020 LIVE R5 Vidu 1-Call Probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'dry-run' (default, zero POST) or 'live' (single-call probe)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  issues: write

concurrency:
  group: wp020-live-r5-vidu1-probe
  cancel-in-progress: false

jobs:
  vidu1_probe:
    name: Execute Bounded 1-Call Vidu Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WP020_VIDU1_EXECUTION_ID: LIVE-20260909-VIDU1-R5
      CANONICAL_BASE_SHA: 5107e3e9ef7702c8403fe74146062ab68e8e50b9
      ISSUE_NUMBER: "63"
      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard manual canonical-main probe dispatch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "STOP: VIDU1 probe may run only by workflow_dispatch" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "STOP: VIDU1 probe must be dispatched on canonical main; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CANONICAL_BASE_SHA" HEAD
          echo "Canonical-main ancestry guard PASS at $GITHUB_SHA"

      - name: Check Owner authorization & fence if live
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "live" ]; then
            echo "Checking Owner authorization marker and execution fence for $WP020_VIDU1_EXECUTION_ID..."
            AUTH_MARKER="FRESH_OWNER_AUTHORIZED_VIDU1: ${WP020_VIDU1_EXECUTION_ID} @ ${GITHUB_SHA}"
            FENCE_MARKER="EXECUTION_STARTED: ${WP020_VIDU1_EXECUTION_ID}"
            TERMINAL_PASS="VIDU1_PROBE_PASS: ${WP020_VIDU1_EXECUTION_ID}"
            TERMINAL_STOP="VIDU1_PROBE_STOPPED: ${WP020_VIDU1_EXECUTION_ID}"
            
            COMMENTS="$(gh issue view "${ISSUE_NUMBER}" --comments --json comments --jq '.comments[].body')"
            
            if ! printf '%s\n' "${COMMENTS}" | grep -Fx "${AUTH_MARKER}" >/dev/null; then
              echo "STOP: exact fresh Owner VIDU1 paid authorization marker missing for current main" >&2
              exit 1
            fi
            if printf '%s\n' "${COMMENTS}" | grep -Fx "${FENCE_MARKER}" >/dev/null; then
              echo "STOP: VIDU1 one-shot execution fence already consumed" >&2
              exit 1
            fi
            if printf '%s\n' "${COMMENTS}" | grep -F "${TERMINAL_PASS}" >/dev/null || printf '%s\n' "${COMMENTS}" | grep -F "${TERMINAL_STOP}" >/dev/null; then
              echo "STOP: VIDU1 execution identity already has terminal evidence" >&2
              exit 1
            fi
            
            echo "Consuming VIDU1 execution fence..."
            gh issue comment "${ISSUE_NUMBER}" --body "${FENCE_MARKER}"
            echo "VIDU1 execution fence consumed successfully."
          else
            echo "Dry-run / preflight mode: zero provider generation calls, no fence consumed."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run VIDU1 probe
        run: |
          mkdir -p vidu1_evidence
          PYTHONPATH=backend:. python .github/scripts/wp020_live_r5_vidu1.py --mode ${{ github.event.inputs.mode }}

      - name: Post terminal marker and evidence to Issue 63 if live
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "live" ] && [ -f vidu1_evidence/vidu1_execution_evidence.json ]; then
            STATUS="$(jq -r .status vidu1_evidence/vidu1_execution_evidence.json)"
            if [ "$STATUS" = "SUCCESS" ]; then
              MARKER="VIDU1_PROBE_PASS: ${WP020_VIDU1_EXECUTION_ID}"
            else
              MARKER="VIDU1_PROBE_STOPPED: ${WP020_VIDU1_EXECUTION_ID}"
            fi
            BODY=$(cat <<EOF
          ${MARKER}

          Sanitized VIDU1 Execution Evidence:
          \`\`\`json
          $(cat vidu1_evidence/vidu1_execution_evidence.json)
          \`\`\`
          EOF
          )
            gh issue comment "${ISSUE_NUMBER}" --body "${BODY}"
          fi

      - name: Upload sanitized VIDU1 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidu1-probe-sanitized-evidence
          path: vidu1_evidence/vidu1_execution_evidence.json
          if-no-files-found: ignore
