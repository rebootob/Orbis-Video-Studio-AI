name: WP020A R1 Apply

on:
  push:
    branches:
      - ai/p4-wp020-a-r1-s1-correctives
    paths:
      - scripts/wp020a_r1_apply.py
      - .github/workflows/wp020a-r1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/p4-wp020-a-r1-s1-correctives
      - name: Apply bounded corrective
        run: python scripts/wp020a_r1_apply.py
      - name: Validate patch
        run: git diff --check
      - name: Commit bounded corrective
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git diff --cached --quiet && { echo "No backend corrective changes produced"; exit 1; }
          git commit -m "fix(wp020): close zero-billing S1 integration blockers"
          git push origin HEAD:ai/p4-wp020-a-r1-s1-correctives
