name: WP020 LIVE R3 Paid One-Shot Execution

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wp020-live-r3-paid-one-shot
  cancel-in-progress: false

jobs:
  live_execution:
    name: Execute Bounded LIVE UAT R3
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbis_uat
          POSTGRES_PASSWORD: orbis_uat_password
          POSTGRES_DB: orbis_live_uat_r3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis_uat -d orbis_live_uat_r3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WP020_LIVE_EXECUTION_ID: LIVE-20260909-363F-R3
      TOOLING_BASE_SHA: 363ffe6a0bd325c7c557b80daa665ee3575df6f8
      PREFLIGHT_MAIN_SHA: ${{ github.sha }}
      WP020_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/live_evidence
      ISSUE_NUMBER: "63"
      ENVIRONMENT: uat
      DEBUG: "false"
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: orbis_uat
      POSTGRES_PASSWORD: orbis_uat_password
      POSTGRES_DB: orbis_live_uat_r3
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: orbis-live-uat-r3
      OBJECT_STORAGE_ACCESS_KEY: orbisminio
      OBJECT_STORAGE_SECRET_KEY: orbisminiosecret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_SECURE: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CREATIVE_MODEL: gpt-4o
      OPENAI_MAX_RETRIES: "0"
      DEFAULT_CREATIVE_PROFILE: FAST
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_SIZE: 1K
      VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
      VIDU_DEFAULT_MODEL: viduq2
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
      DEFAULT_IMAGE_PROVIDER: gemini_image
      DEFAULT_VIDEO_PROVIDER: vidu
      DEFAULT_AUDIO_PROVIDER: elevenlabs_audio
      PROVIDER_PRICING_CONFIG: >-
        {"openai:STORY_GENERATION:gpt-4o":{"provider":"openai","operation":"STORY_GENERATION","model":"gpt-4o","cost_per_1k_prompt_tokens":0.0025,"cost_per_1k_completion_tokens":0.0100,"currency":"USD"},"gemini_image:IMAGE_GENERATION:gemini-3.1-flash-image":{"provider":"gemini_image","operation":"IMAGE_GENERATION","model":"gemini-3.1-flash-image","cost_per_generation":0.08,"currency":"USD"},"vidu:VIDEO_GENERATION:viduq2":{"provider":"vidu","operation":"VIDEO_GENERATION","model":"viduq2","cost_per_generation":0.05,"cost_per_second":0.025,"currency":"USD"}}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard manual canonical-main execution
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TOOLING_BASE_SHA" HEAD

      - name: Require exact fresh Owner R3 authorization and unused identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wp020_live_r3_fence.sh check

      - name: Start ephemeral MinIO
        shell: bash
        run: |
          docker run -d --rm --name orbis-live-r3-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_KEY" \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg and ffprobe are available
        shell: bash
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Rerun R3 no-paid preflight immediately before fence
        working-directory: backend
        run: PYTHONPATH=.:../.github/scripts python ../.github/scripts/wp020_live_r3_preflight.py

      - name: Recheck authorization and consume Issue 63 R3 fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wp020_live_r3_fence.sh consume

      - name: Run bounded LIVE R3 UAT runner
        working-directory: backend
        env:
          AUTHORIZED_MAIN_SHA: ${{ github.sha }}
          EXECUTION_FENCE_CONFIRMED: "true"
        run: PYTHONPATH=.:../.github/scripts python ../.github/scripts/wp020_live_uat_r3.py

      - name: Post Issue 63 sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$WP020_LIVE_EVIDENCE_DIR/issue-comment.md"
          fi

      - name: Upload sanitized LIVE R3 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp020-live-evidence-${{ env.WP020_LIVE_EXECUTION_ID }}
          path: ${{ env.WP020_LIVE_EVIDENCE_DIR }}
          if-no-files-found: warn
