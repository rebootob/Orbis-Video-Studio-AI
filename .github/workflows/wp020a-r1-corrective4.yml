name: WP020A R1 Corrective 4

on:
  push:
    branches:
      - ai/p4-wp020-a-r1-s1-correctives
    paths:
      - scripts/wp020a_r1_corrective4.py
      - .github/workflows/wp020a-r1-corrective4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/p4-wp020-a-r1-s1-correctives
      - name: Apply focused TimelineAudit corrective
        run: python scripts/wp020a_r1_corrective4.py
      - name: Validate patch
        run: git diff --check
      - name: Commit focused corrective
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/archive/import_service.py
          git diff --cached --quiet && { echo "No importer change produced"; exit 1; }
          git commit -m "fix(wp020): align TimelineAudit archive import"
          git push origin HEAD:ai/p4-wp020-a-r1-s1-correctives
